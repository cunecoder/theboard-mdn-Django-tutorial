<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMAR ~ David Marin</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
    radial-gradient(circle at top left,
        rgba(0, 32, 159, 0.65),
        transparent 45%),
    radial-gradient(circle at bottom right,
        rgba(210, 16, 52, 0.65),
        transparent 45%),
    linear-gradient(
        135deg,
        #050816 0%,
        #0d1b66 40%,
        #311550 70%,
        #5e1024 100%
    );

    color: white;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
}

.container{
    text-align:center;
    max-width:900px;
    padding:2rem;
}

.small{
    letter-spacing:8px;
    text-transform:uppercase;
    font-size:.9rem;
    color:#8b9cff;
    margin-bottom:1rem;
}

h1{
    font-size:clamp(4rem,10vw,8rem);
    line-height:.9;
    font-weight:700;
    background:linear-gradient(
        90deg,
        #ffffff,
        #60a5fa,
        #a78bfa,
        #ffffff
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 8s linear infinite;
}

p{
    margin-top:1.5rem;
    font-size:1.2rem;
    color:#b6bfd6;
    line-height:1.7;
}

@keyframes shine{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="small">Haiti • Pimar • Haiti</div>
    <h2>PIMAR<br>~ David Marin's Company ~</h2>
    <p>
        ~ PIMAR se pou MWEN ~<br>
        ~ Si ou vle website sa, ban m yon milyon dola ~<br>
        ~ Ras papa ou ~<br>
        ~ Menm moun fou sezi ~<br>
        ~ Haiti Cheri ~
    </p>
</div>

</body>
</html>
